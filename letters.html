<section class="letter-page">
    <div class="letter-box">
        <h1>💌 My Love Letter</h1>

        <p id="typing"></p>

        <button onclick="showMessage()">❤️ Read Again</button>
    </div>
</section>

<script>
const text = `Every moment with you is a beautiful memory. Thank you for filling my life with happiness, love, and endless smiles.

No matter where life takes us, my heart will always belong to you.

I love you forever. ❤️`;

let i = 0;

function typeWriter() {
    if (i < text.length) {
        document.getElementById("typing").innerHTML += text.charAt(i);
        i++;
        setTimeout(typeWriter, 40);
    }
}

function showMessage() {
    document.getElementById("typing").innerHTML = "";
    i = 0;
    typeWriter();
}

window.onload = typeWriter;
</script>
<div class="hearts">
    <span>❤️</span>
